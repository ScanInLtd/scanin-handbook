<header class="app-header"><div class="brand-mark" id="brand-icon"></div><div class="brand-block"><h1>סקירת נתונים</h1><small>ScanIn · סביבת העבודה של נתן והלל</small></div><span class="readonly-badge">צילום מצב · קריאה בלבד</span><div class="grow"></div><span id="save-status" class="save-status">החלטות נשמרות בדפדפן</span><div class="header-actions"><button id="export" class="primary">ייצוא החלטות</button><details class="menu"><summary>אפשרויות</summary><div class="menu-body"><label>שם הבודק <input id="reviewer" placeholder="נתן / הלל"></label><button id="import">ייבוא החלטות</button><label><input id="include-demo" type="checkbox"> כולל הדגמה ובדיקות</label><input id="file" type="file" accept="application/json" hidden></div></details></div></header>
<div class="app-shell"><aside class="site-sidebar" aria-label="ניווט אתרים"><div class="nav-eyebrow">אתרי ניטור <span id="site-total"></span></div><div class="sidebar-search"><input id="site-search" placeholder="חיפוש אתר…" aria-label="חיפוש ברשימת האתרים"></div><button id="all-sites" class="site-all"></button><nav class="sites-list" id="sites-list"></nav><div class="site-pager" id="site-pager"></div><div class="sidebar-footer"><button id="scope-open">פרטי צילום המצב</button></div></aside><main class="workspace"><div class="workspace-heading"><div class="workspace-title"><small id="workspace-eyebrow"></small><h2 id="workspace-title">סקירה בין־אתרית</h2></div><div class="site-steppers"><button id="prev-site" title="האתר הקודם" aria-label="האתר הקודם"></button><span>מעבר בין אתרים</span><button id="next-site" title="האתר הבא" aria-label="האתר הבא"></button></div><div class="mobile-site"><select id="site-filter" aria-label="בחירת אתר"></select></div></div><div class="tabs" id="tabs" role="tablist" aria-label="סוג הבדיקה"></div><section class="desk" id="desk" data-mobile="list"><aside class="sensor-pane" aria-label="רשימת חיישנים"><div class="sensor-toolbar"><div class="pane-title">חיישנים לבדיקה <span id="sensor-count"></span></div><input id="search" placeholder="חיפוש חיישן…" aria-label="חיפוש חיישן"></div><div class="sensor-list" id="sensor-list"></div><div class="sensor-pager" id="sensor-pager"></div></aside><article class="review-pane" aria-label="בדיקת החיישן"><div class="review-heading" id="review-heading"></div><div class="review-content" id="review-content"></div><div class="review-footer"><span id="review-progress">החלטות בלבד · ללא שינוי נתונים</span><button id="review-action">לבדיקה ולהחלטה</button></div></article></section></main></div><dialog id="scope-dialog" class="scope-dialog"><button id="scope-close" class="scope-close" aria-label="סגירה">סגירה</button><h2>על צילום המצב</h2><div id="scope-line" class="scope-line"></div><div id="scope-note" class="footer"></div></dialog><div class="toast" role="status" id="toast"></div>

<script>
'use strict';
const D=JSON.parse(document.getElementById('audit-data').textContent),DAY=86400000;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t===null||t===undefined?'—':new Date(t).toLocaleDateString('he-IL',{timeZone:'UTC'}),iso=t=>new Date(t).toISOString().slice(0,10),nf=n=>Number(n||0).toLocaleString('he-IL'),value=n=>n===null||n===undefined?'—':Number(n).toLocaleString('he-IL',{maximumFractionDigits:3});
const storageKey='scanin-focused-review-v2-'+D.createdAt,legacyKey='scanin-site-audit-v1-'+D.createdAt;
function load(key){try{const x=JSON.parse(localStorage.getItem(key)||'{}');return x&&typeof x==='object'&&!Array.isArray(x)?x:{};}catch{return {};}}
let answers=load(storageKey),legacy=load(legacyKey),mode='raw',site='',query='',selected=null,axis=0,from=D.from,to=D.until,showRaw=true,showMA=true,preview=false;
const viewKey='scanin-review-workspace-v3-'+D.createdAt,workspaceMemory=load(viewKey),SITE_SIZE=7,SENSOR_SIZE=6;
let sitePage=0,sensorPage=0,siteQuery='',detailPanel='chart',eventPage=0,intervalPage=0,pendingReviewScroll=null;
const contextViews=workspaceMemory.contexts||{},sensorViews=workspaceMemory.sensors||{};
const iconPaths={sites:'M3 21h18M5 21V4h14v17M9 8h1m4 0h1M9 12h1m4 0h1M10 21v-5h4v5',raw:'M3 8h5m8 0h5M3 16h8m5 0h5M3 5v14m18-14v14',ma:'M3 17l5-7 4 3m4-3 5-6M3 21h18',jumps:'M3 18h6V7h6v5h6',left:'m15 6-6 6 6 6',right:'m9 6 6 6-6 6',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',info:'M12 11v6m0-10h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${iconPaths[name]||iconPaths.sites}"/></svg>`;}
function rememberWorkspace(){if(selected)sensorViews[mode+':'+selected]={axis,from,to,showRaw,showMA,preview,detailPanel,eventPage,intervalPage,scroll:$('review-content').scrollTop};contextViews[mode+':'+site]={selected,query,sensorPage};try{localStorage.setItem(viewKey,JSON.stringify({mode,site,sitePage,sensorPage,selected,mobile:$('desk').dataset.mobile,contexts:contextViews,sensors:sensorViews,reviewer:$('reviewer').value,includeDemo:$('include-demo').checked}));}catch{}}
function restoreSensor(id){const v=sensorViews[mode+':'+id],s=allSensors.find(s=>s.id===id);selected=id;axis=v?.axis||0;from=v?.from??Math.max(D.from,s.focus.from);to=v?.to??D.until;showRaw=v?.showRaw??mode!=='ma';showMA=v?.showMA??true;preview=v?.preview??false;detailPanel=v?.detailPanel==='decision'?'decision':'chart';eventPage=v?.eventPage||0;intervalPage=v?.intervalPage||0;pendingReviewScroll=v?.scroll||0;}
function restoreContext(){const v=contextViews[mode+':'+site];query=v?.query||'';$('search').value=query;selected=null;sensorPage=v?.sensorPage||0;if(v?.selected&&visibleSensors().some(s=>s.id===v.selected))restoreSensor(v.selected);}
function switchSite(id){rememberWorkspace();site=id;restoreContext();const index=siteProjects().findIndex(p=>p.id===id);if(index>=0)sitePage=Math.floor(index/SITE_SIZE);$('desk').dataset.mobile='list';render();}
function switchMode(key){rememberWorkspace();mode=key;restoreContext();render();}
function siteProjects(){return projects().filter(p=>!siteQuery||p.name.toLowerCase().includes(siteQuery.toLowerCase())).slice().sort((a,b)=>a.name.localeCompare(b.name,'he'));}
function pager(id,page,total,previous,next){$(id).innerHTML=`<button class="pager-button" aria-label="עמוד קודם" ${page===0?'disabled':''}>${icon('right')}</button><span class="pager-caption">עמוד ${page+1} מתוך ${Math.max(1,total)}</span><button class="pager-button" aria-label="עמוד הבא" ${page+1>=total?'disabled':''}>${icon('left')}</button>`;const bs=$(id).querySelectorAll('button');bs[0].onclick=previous;bs[1].onclick=next;}
function renderSites(){const ps=siteProjects(),ss=allSensors.filter(s=>projects().some(p=>p.id===s.projectId)&&inMode(s)),pages=Math.ceil(ps.length/SITE_SIZE);sitePage=Math.max(0,Math.min(sitePage,pages-1));$('site-total').textContent=projects().length;$('all-sites').classList.toggle('active',!site);$('all-sites').innerHTML=icon('sites')+'כל האתרים<span class="site-count">'+ss.length+'</span>';$('sites-list').innerHTML=ps.slice(sitePage*SITE_SIZE,(sitePage+1)*SITE_SIZE).map(p=>{const n=ss.filter(s=>s.projectId===p.id).length;return `<button class="site-nav-item ${site===p.id?'active':''} ${n?'':'zero'}" data-site="${esc(p.id)}" aria-current="${site===p.id?'page':'false'}" title="${esc(p.name)}"><span class="site-name">${esc(p.name)}</span><span class="site-count">${n}</span></button>`;}).join('')||'<div class="sensor-empty">אין אתרים התואמים לחיפוש</div>';$('sites-list').querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>switchSite(b.dataset.site));pager('site-pager',sitePage,pages,()=>{sitePage--;renderSites();rememberWorkspace();},()=>{sitePage++;renderSites();rememberWorkspace();});}
function hasDecision(s){const r=record(s);return mode==='jumps'?Object.keys(r.jumps||{}).length>0||!!r.note?.trim():!!r.gaps?.[mode];}
function renderSensors(){const ss=visibleSensors(),pages=Math.ceil(ss.length/SENSOR_SIZE),scroll=$('sensor-list').scrollTop;sensorPage=Math.max(0,Math.min(sensorPage,pages-1));$('sensor-count').textContent=nf(ss.length)+' חיישנים';$('sensor-list').innerHTML=ss.slice(sensorPage*SENSOR_SIZE,(sensorPage+1)*SENSOR_SIZE).map((s,i)=>`<button class="sensor-card ${selected===s.id?'active':''}" data-sensor="${esc(s.id)}" aria-current="${selected===s.id?'true':'false'}"><span class="sensor-card-head"><span class="sensor-label" title="${esc(s.name)}">${esc(s.name)}</span><span class="sensor-index">${sensorPage*SENSOR_SIZE+i+1}</span></span><small title="${esc(s.projectName)}">${esc(site?s.section||s.projectName:s.projectName)}</small><span class="case-summary"><i class="state-dot ${hasDecision(s)?'recorded':''}"></i>${esc(hasDecision(s)?'תועדה החלטה':summary(s))}${s.partial?' · חלקי':''}</span></button>`).join('')||'<div class="sensor-empty">אין חיישנים התואמים לסינון. אפשר לבחור אתר אחר או לשנות את סוג הבדיקה.</div>';$('sensor-list').scrollTop=scroll;$('sensor-list').querySelectorAll('[data-sensor]').forEach(b=>b.onclick=()=>openSensor(b.dataset.sensor));pager('sensor-pager',sensorPage,pages,()=>moveSensorPage(-1),()=>moveSensorPage(1));}
function moveSensorPage(delta){const ss=visibleSensors(),page=sensorPage+delta;if(page<0||page*SENSOR_SIZE>=ss.length)return;openSensor(ss[page*SENSOR_SIZE].id);}
function moveSensor(delta){const ss=visibleSensors(),i=ss.findIndex(s=>s.id===selected),next=i+delta;if(next>=0&&next<ss.length)openSensor(ss[next].id);}
function moveSite(delta){const ps=projects().filter(p=>allSensors.some(s=>s.projectId===p.id&&inMode(s))).slice().sort((a,b)=>a.name.localeCompare(b.name,'he')),current=site||allSensors.find(s=>s.id===selected)?.projectId,index=ps.findIndex(p=>p.id===current),next=index+delta;if(next>=0&&next<ps.length){siteQuery='';$('site-search').value='';switchSite(ps[next].id);}}
function refreshProgress(){const ss=visibleSensors(),n=ss.filter(hasDecision).length;$('review-progress').textContent=n+' / '+ss.length+' עם החלטה · ללא שינוי נתונים';$('save-status').textContent='נשמר בדפדפן';renderSensors();}
function setDetailPanel(panel){detailPanel=panel;const chart=$('chart-pane'),decisions=$('decision-pane');if(chart)chart.hidden=panel!=='chart';if(decisions)decisions.hidden=panel!=='decision';document.querySelectorAll('[data-panel]').forEach(b=>{b.classList.toggle('active',b.dataset.panel===panel);b.setAttribute('aria-selected',String(b.dataset.panel===panel));});$('review-action').textContent=panel==='chart'?'לבדיקה ולהחלטה':'חזרה לגרף';$('review-content').scrollTop=0;if(selected)draw(allSensors.find(s=>s.id===selected));rememberWorkspace();}
function renderReviewHeading(s){const ss=visibleSensors(),i=ss.findIndex(x=>x.id===s.id);$('review-heading').innerHTML=`<div class="review-title-row"><button id="back" class="mobile-back" aria-label="חזרה לרשימת החיישנים">${icon('right')}</button><div style="min-width:0"><div class="review-breadcrumb" title="${esc(s.projectName+' / '+s.section)}">${esc(s.projectName)} / ${esc(s.section)}</div><div class="review-title-line"><h2>חיישן ${esc(s.name)}</h2><span class="review-subtitle">${esc(summary(s))}</span></div></div><div class="review-position"><button id="prev" aria-label="החיישן הקודם" ${i<=0?'disabled':''}>${icon('right')}</button><span>${i+1} / ${ss.length}</span><button id="next" aria-label="החיישן הבא" ${i+1>=ss.length?'disabled':''}>${icon('left')}</button></div></div><div class="review-tabs" role="tablist" aria-label="תצוגת החיישן"><button data-panel="chart" class="${detailPanel==='chart'?'active':''}" role="tab" aria-selected="${detailPanel==='chart'}">גרף ונתונים</button><button data-panel="decision" class="${detailPanel==='decision'?'active':''}" role="tab" aria-selected="${detailPanel==='decision'}">בדיקה והחלטה</button></div>`;$('prev').onclick=()=>moveSensor(-1);document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>setDetailPanel(b.dataset.panel));$('review-action').textContent=detailPanel==='chart'?'לבדיקה ולהחלטה':'חזרה לגרף';$('review-action').disabled=false;refreshProgress();}
function bindCasePager(s){const gs=mode==='raw'?s.focus.rawGaps:s.focus.maGaps,total=mode==='jumps'?s.focus.proposals.length:Math.ceil(gs.length/8),current=mode==='jumps'?eventPage:intervalPage,node=mode==='jumps'?$('preview')?.parentElement:document.querySelector('.intervals');if(total<=1||!node)return;node.insertAdjacentHTML('beforebegin',`<div class="case-pager"><span>${mode==='jumps'?'קפיצה':'עמוד תקופות'} ${current+1} מתוך ${total}</span><button class="pager-button" data-case-prev aria-label="מקרה קודם" ${current===0?'disabled':''}>${icon('right')}</button><button class="pager-button" data-case-next aria-label="מקרה הבא" ${current+1>=total?'disabled':''}>${icon('left')}</button></div>`);document.querySelector('[data-case-prev]').onclick=()=>{if(mode==='jumps')eventPage--;else intervalPage--;detail(s);};document.querySelector('[data-case-next]').onclick=()=>{if(mode==='jumps')eventPage++;else intervalPage++;detail(s);};}
const allSensors=D.projects.flatMap(p=>p.sensors.map(s=>({...s,projectId:p.id,projectName:p.name,category:p.category})));
const texts={raw:{title:'חורים במדידות',subtitle:'חסר דאטא גולמי',hint:'כאן חסרות מדידות עצמן. חישוב ממוצע מחדש לא יוכל להשלים אותן. מוצגים ימים שלמים בלי מדידות, פערים ארוכים והפסקת מדידות עד צילום המצב.'},ma:{title:'חורים בממוצע הנע',subtitle:'יש מדידות, חסר הקו בדוח',hint:'כאן יש מדידות נקיות, אך חסר MA לפחות בחלק מהצירים. לפעמים ניתן לחשב מחדש, ולפעמים חסרות מספיק מדידות בחלון. זו לא בקשה להמציא נתונים.'},jumps:{title:'קפיצות לגיהוץ',subtitle:'הכרעה ואישור של נתן',hint:'ההצעה היא לשמור את הרמה העדכנית ולהזיז את הרמות הקודמות סביבה — לא לשטח תנועה הדרגתית. כל קפיצה דורשת אישור מפורש; אפשר גם להשאיר או לסמן לא בטוח.'}};
function toast(text){$('toast').textContent=text;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',5000);}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(answers));return true;}catch{toast('השמירה בדפדפן נכשלה — יש לייצא את ההחלטות לפני סגירה.');return false;}}
function projects(){return D.projects.filter(p=>$('include-demo').checked||p.category==='operational');}
function inMode(s){const f=s.focus;return !!f&&f.supported&&(mode==='raw'?f.rawGaps.length>0:mode==='ma'?f.maMissing>0:f.needsJumpReview);}
function visibleSensors(){const ids=new Set(projects().map(p=>p.id));return allSensors.filter(s=>ids.has(s.projectId)&&(!site||s.projectId===site)&&(!query||[s.projectName,s.name,s.id].join(' ').toLowerCase().includes(query.toLowerCase()))&&inMode(s));}
function record(s){return answers[s.id]||{fingerprint:s.fingerprint,referenceDay:s.focus.referenceDay,note:'',jumps:{},gaps:{}};}
function updateRecord(s,patch){answers[s.id]={...record(s),...patch,fingerprint:s.fingerprint,reviewer:$('reviewer').value,reviewedAt:new Date().toISOString()};const saved=persist();refreshProgress();if(!saved)$('save-status').textContent='לא נשמר — יש לייצא החלטות';rememberWorkspace();}
function labelAxis(s,k){return s.type==='prism'?['X','Y','Z'][k]:(s.axes[k]?.label||s.axes[k]?.key||'');}
function referenceValues(s,day=record(s).referenceDay??s.focus.referenceDay){return day===s.focus.referenceDay?s.focus.reference:(s.analysis.days.find(d=>d.t===day)?.raw||s.axes.map(()=>null));}
function canApprove(s,p,ref=record(s).referenceDay??s.focus.referenceDay){const values=referenceValues(s,ref);return !s.focus.mappingHold&&ref!==null&&p.changes.every(c=>Number.isFinite(values[s.axes.findIndex(a=>a.key===c.axis)]));}
function jumpStatus(s){const decisions=Object.values(record(s).jumps||{});return decisions.some(d=>d.decision==='approve-iron')?'נרשם אישור גיהוץ':decisions.length?'נרשמה החלטה':'';}
function renderHeader(){const ps=projects(),ids=new Set(ps.map(p=>p.id)),ss=allSensors.filter(s=>ids.has(s.projectId));$('scope-line').textContent=ps.length+' אתרים · '+nf(ss.length)+' חיישנים · צילום '+fmt(Date.parse(D.createdAt))+' · הטווח שנבדק: '+fmt(D.from)+'–'+fmt(D.until);$('tabs').innerHTML=Object.entries(texts).map(([key,t])=>{const n=ss.filter(s=>s.focus?.supported&&(key==='raw'?s.focus.rawGaps.length:key==='ma'?s.focus.maMissing>0:s.focus.needsJumpReview)).length;return `<button class="tab ${mode===key?'active':''}" data-mode="${key}" aria-pressed="${mode===key}" role="tab" aria-selected="${mode===key}"><span class="tab-icon">${icon(key)}</span><span><b>${t.title}</b><small>${t.subtitle}</small></span><span class="number">${nf(n)}</span></button>`;}).join('');$('tabs').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));const prev=$('site-filter').value;$('site-filter').innerHTML='<option value="">כל האתרים</option>'+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');$('site-filter').value=site;const unknown=ss.filter(s=>!s.focus?.supported||s.partial||!s.expectsMA);$('scope-note').innerHTML=`סיכום יומי, לא כל דגימה בנפרד. התקופה שלפני ${fmt(D.from)} לא נבדקה כאן. ${unknown.length?`<details><summary>${nf(unknown.length)} חיישנים נבדקו חלקית או דורשים בדיקה ייעודית — אין להסיק שהם ללא חורים.</summary>${unknown.map(s=>`<p>${esc(s.projectName)} / ${esc(s.name)}: ${s.partial&&s.focus?.supported?'היסטוריה חלקית, מ־'+fmt(s.assessedFrom):esc(s.maScope||s.error||'לא נבדקה הסדרה')}</p>`).join('')}</details>`:''}`;}
function summary(s){const f=s.focus;if(mode==='raw'){const gs=f.rawGaps;return nf(gs.length)+' פערים'+(gs.some(g=>g.trailing)?' · אין מדידות עדכניות':'');}if(mode==='ma')return nf(f.maMissing)+' מדידות נקיות ללא MA מלא';return f.mappingHold?'שאלת מיפוי — לא לגהץ לפני בירור':f.proposals.length?nf(f.proposals.length)+' קפיצות לבדיקה':'רמות שונות — נדרשת בחירה ידנית';}
function render(){if(site&&!projects().some(p=>p.id===site))site='';renderHeader();const ss=visibleSensors();if(!ss.some(s=>s.id===selected))selected=null;if(!selected&&ss.length)restoreSensor(ss[0].id);if(selected)sensorPage=Math.floor(ss.findIndex(s=>s.id===selected)/SENSOR_SIZE);renderSites();renderSensors();$('workspace-title').textContent=site?projects().find(p=>p.id===site)?.name:'סקירה בין־אתרית';$('workspace-eyebrow').textContent='צילום '+fmt(Date.parse(D.createdAt))+' · '+ss.length+' חיישנים בקטגוריה';if(selected)detail(allSensors.find(s=>s.id===selected));else{$('review-heading').innerHTML='';$('review-content').innerHTML='<div class="empty">'+icon('ma')+'<strong>אין מקרים בתצוגה הזו</strong>בחרו אתר או קטגוריה אחרים.<br>חיישנים שלא נבדקו אינם נחשבים תקינים אוטומטית.</div>';$('review-action').disabled=true;$('review-progress').textContent='צילום מצב · ללא שינוי נתונים';}rememberWorkspace();}
function openSensor(id){rememberWorkspace();restoreSensor(id);$('desk').dataset.mobile='review';render();}
function intervals(s){const f=s.focus,gs=mode==='raw'?f.rawGaps:f.maGaps;return `<h3>${mode==='raw'?'מתי חסרות מדידות?':'מתי חסר הממוצע הנע?'}</h3>${mode==='ma'?`<p><b>${nf(f.maMissing)}</b> מדידות נקיות חסרות MA לפחות בציר אחד. ${nf(s.analysis.counts.candidate)} מהן הוערכו כמתאימות לבדיקה של חישוב מחדש, לא כהבטחה להשלמה.</p>`:''}<div class="intervals">${gs.length?gs.slice(intervalPage*8,(intervalPage+1)*8).map((g,i)=>`<button class="interval" data-interval="${intervalPage*8+i}">${fmt(g.from)} — ${fmt(mode==='ma'||g.dailyEstimate?g.to-1:g.to)} ${g.trailing?'· עד צילום המצב / הפסקת מדידות':''} ${mode==='ma'&&g.missing?'· '+nf(g.missing)+' מדידות ללא MA':''} <small>הצגה בגרף ←</small></button>`).join(''):'<p style="padding:10px">חוסר חלקי בצירים או בתוך יום; אין בסיכום הנוכחי פירוט מספק לתאריכים המדויקים.</p>'}</div>${mode==='ma'&&f.maDatesIncomplete?'<small>הספירה כוללת גם חוסר חלקי בצירים. רשימת התקופות היומית אינה ממפה את כולו; נדרשת בדיקת דגימות כדי לדייק.</small>':''}<div class="actions"><button data-gap-action="${mode==='ma'?'check-ma':'acknowledged'}">${mode==='ma'?'לבדוק אם אפשר לחשב MA':'ראינו — חסרות מדידות'}</button><button data-gap-action="no-action">אין צורך בטיפול כרגע</button><span class="tag" id="gap-state">${record(s).gaps?.[mode]?'נרשמה החלטה':''}</span></div>`;}
function jumpCards(s){const f=s.focus,r=record(s),reference=r.referenceDay??f.referenceDay;return `<div class="reference"><b>הרמה שנשמרת: ${reference===f.referenceDay?'הרמה העדכנית':'הרמה בתאריך שנבחר'}</b> · ${fmt(reference)}<div class="delta">${referenceValues(s).map((v,k)=>`${esc(labelAxis(s,k))}: ${value(v)} ${esc(s.axes[k].unit)}`).join(' · ')}</div><div>ברירת המחדל היא הרמה של הימים הנקיים האחרונים, לא דגימה חשודה בודדת.</div><details><summary>הרמה העדכנית אינה הנכונה? בחרו יום ייחוס אחר</summary><label>יום ייחוס <input id="reference" type="date" value="${reference!==null?iso(reference):''}" min="${iso(s.focus.from)}" max="${s.focus.referenceDay!==null?iso(s.focus.referenceDay):iso(D.until)}"></label><small>תאריך אחר דורש הסבר בהערה. אין הנחה שכל תנועה אמיתית צריכה להיעלם.</small></details></div>${f.mappingHold?'<div class="hint"><b>יש כאן שאלה פתוחה על מיפוי / שתי פריזמות.</b> אין אישור גיהוץ עד שהמיפוי יתברר. אפשר לתעד החלטה בהערה.</div>':''}${!f.proposals.length?'<div class="hint">הסדרה מציגה רמות שונות, אך אין הצעה בטוחה לקפיצה בודדת. סמנו בהערה איזו תקופה ורמה נכונות; לא נוצר כאן אישור אוטומטי.</div>':''}<div class="actions"><button id="preview">${preview?'הסתרת ההצעה':'הצגת הצעת הגיהוץ בגרף'}</button><small>תצוגת כל ההצעות שלא סומנו ״להשאיר״, גם אם טרם אושרו. הזזת רמות בלבד — לא חישוב MA.</small></div>${f.proposals.slice(eventPage,eventPage+1).map(p=>{const d=r.jumps?.[p.id]?.decision;return `<article class="jump"><div class="jump-header"><b>קפיצה סביב ${fmt(p.time)}</b><button data-zoom-jump="${esc(p.id)}">מיקוד בגרף</button></div><div class="delta">${p.changes.map(c=>{const k=s.axes.findIndex(a=>a.key===c.axis);return `${esc(labelAxis(s,k))}: ${value(c.before)} → ${value(c.after)} (${c.delta>=0?'+':''}${value(c.delta)} ${esc(s.axes[k].unit)})`;}).join(' · ')}</div>${p.acrossGap?'<p class="context-note">יש חוסר מדידות בין שתי הרמות. מועד הקפיצה המדויק אינו ידוע.</p>':''}${!canApprove(s,p)&&!f.mappingHold?'<p class="context-note">חסר ערך תקף בציר הייחוס. יש לבחור יום ייחוס עם מדידות או להשאיר לבירור — לא לאשר גיהוץ לעוגן חסר.</p>':''}<div class="actions">${[['approve-iron','מאשר גיהוץ לעוגן שנבחר'],['leave','תנועה אמיתית — להשאיר'],['unsure','לא בטוח']].map(([key,title])=>`<button data-jump="${esc(p.id)}" data-decision="${key}" class="${key==='approve-iron'?'approve':''} ${d===key?'selected':''}" ${key==='approve-iron'&&!canApprove(s,p)?'disabled':''}>${title}</button>`).join('')}</div><small>${d==='approve-iron'?'אישור נרשם לייצוא — עדיין לא בוצע':d==='leave'?'נרשם: לשמור את הקפיצה':d==='unsure'?'נרשם: ממתין לבירור':'טרם נרשמה החלטה'}</small></article>`;}).join('')}`;}
function detail(s){if(!s){selected=null;render();return;}const scroll=pendingReviewScroll??$('review-content').scrollTop;pendingReviewScroll=null;const f=s.focus,r=record(s);renderReviewHeading(s);$('review-content').innerHTML=`${s.partial?`<div class="hint">בדיקה חלקית בלבד: נבדקו הנתונים מ־${fmt(s.assessedFrom)}. התקופה שלא נקראה אינה מוצגת כתקינה.</div>`:''}<div id="chart-pane" ${detailPanel==='chart'?'':'hidden'}><section class="card"><div class="card-body"><div class="chart-tools"><div class="axis-buttons">${s.axes.map((a,k)=>`<button data-axis="${k}" class="${axis===k?'active':''}">${esc(labelAxis(s,k))} <small>${esc(a.unit)}</small></button>`).join('')}</div><span class="grow"></span><div class="range-tools"><input id="from" type="date" value="${iso(from)}" aria-label="מתאריך"><span>—</span><input id="to" type="date" value="${iso(to)}" aria-label="עד תאריך"><button id="full-range">כל התקופה</button></div></div><div class="chart-wrap"><canvas id="chart" role="img" aria-label="גרף החיישן"></canvas></div><div class="legend"><label><input id="show-ma" type="checkbox" ${showMA?'checked':''}><span style="color:#2463cc">●</span> הממוצע הנע שבדוח</label><label><input id="show-raw" type="checkbox" ${showRaw?'checked':''}><span style="color:#8191a4">●</span> מדידות (חציון יומי)</label>${preview?'<span style="color:#16805f">● הצעת גיהוץ, לא נתונים שמורים</span>':''}<span>רקע אפור: אין מדידות · כתום: חסר MA</span></div><div class="caption" id="caption"></div><div class="coverage" id="coverage"></div><small>סיכום יומי · הקו הכחול נקטע כשאין MA.</small></div></section></div><div id="decision-pane" ${detailPanel==='decision'?'':'hidden'}><section class="card"><div class="card-body"><div class="decision-intro">${texts[mode].hint}</div>${mode==='jumps'?jumpCards(s):intervals(s)}<label for="note"><b>הערה / חריגה מהכלל</b></label><textarea id="note" placeholder="למשל: הרמה הנוכחית נכונה; לפני יולי זו פריזמה אחרת; להשאיר את התנועה בתקופה זו">${esc(r.note)}</textarea><details class="extras"><summary>היקף הבדיקה ותיקונים קודמים</summary><p>תיקונים קיימים כבר נלקחו בחשבון. אישורים חדשים הם לגיהוץ באמצעות בייסליינים בלבד; הדאטא הגולמי נשמר.</p>${(s.completed||[]).map(text=>`<p>כבר בוצע — לא להריץ שוב: ${esc(text)}</p>`).join('')}${(s.notes||[]).map(text=>`<p>${esc(text)}</p>`).join('')}${legacy[s.id]?`<p>החלטה שנשמרה בממשק הקודם (לא מועתקת כאישור חדש): ${esc(legacy[s.id].decision)} · ${esc(legacy[s.id].note)}</p>`:''}<p>זיהוי אוטומטי יומי בלבד: בפריזמות מחפשים צעדים של 3 מ״מ לפחות, מעל רעש הרקע, עם רמה יציבה משני הצדדים. זהו חשד לבדיקה, לא הוכחה שקיימת תקלה. תנועה הדרגתית אינה הצעת גיהוץ.</p><p>חיישן: ${esc(s.id)} · גרסת צילום: ${esc(s.fingerprint)} · טווח הסריקה: ${fmt(f.from)}–${fmt(D.until)}.</p></details></div></section></div>`;
$('back').onclick=()=>{$('desk').dataset.mobile='list';rememberWorkspace();};$('next').onclick=()=>moveSensor(1);$('note').oninput=e=>updateRecord(s,{note:e.target.value});document.querySelectorAll('[data-axis]').forEach(b=>b.onclick=()=>{axis=Number(b.dataset.axis);detail(s);});$('show-ma').onchange=e=>{showMA=e.target.checked;draw(s);};$('show-raw').onchange=e=>{showRaw=e.target.checked;draw(s);};for(const name of ['from','to'])$(name).onchange=()=>{const a=Date.parse($('from').value+'T00:00:00Z'),b=Math.min(D.until,Date.parse($('to').value+'T23:59:59.999Z'));if(!Number.isFinite(a)||!Number.isFinite(b)||a>=b){toast('טווח תאריכים לא תקין');return;}from=a;to=b;draw(s);};$('full-range').onclick=()=>{from=Math.max(D.from,f.from);to=D.until;detail(s);};document.querySelectorAll('[data-interval]').forEach(b=>b.onclick=()=>{const g=(mode==='raw'?f.rawGaps:f.maGaps)[Number(b.dataset.interval)];zoom(s,g.from-3*DAY,g.to+3*DAY);});document.querySelectorAll('[data-gap-action]').forEach(b=>b.onclick=()=>{updateRecord(s,{gaps:{...record(s).gaps,[mode]:{decision:b.dataset.gapAction,reviewedAt:new Date().toISOString()}}});$('gap-state').textContent='נרשמה החלטה';});document.querySelectorAll('[data-zoom-jump]').forEach(b=>b.onclick=()=>{const p=f.proposals.find(p=>p.id===b.dataset.zoomJump);axis=Math.max(0,s.axes.findIndex(a=>a.key===p.changes[0].axis));zoom(s,p.lastBeforeDay-10*DAY,p.time+10*DAY);});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{if(b.dataset.decision==='approve-iron'&&!canApprove(s,f.proposals.find(p=>p.id===b.dataset.jump))){toast('חסר ערך בציר הייחוס או שהמיפוי טרם הוכרע');return;}if(b.dataset.decision==='approve-iron'&&record(s).referenceDay!==f.referenceDay&&!record(s).note.trim()){toast('יש לפרט בהערה מדוע נבחר יום ייחוס אחר');return;}updateRecord(s,{jumps:{...record(s).jumps,[b.dataset.jump]:{decision:b.dataset.decision,reviewedAt:new Date().toISOString(),reviewer:$('reviewer').value}}});detail(s);});if($('preview'))$('preview').onclick=()=>{preview=!preview;detail(s);};if($('reference'))$('reference').onchange=e=>{const time=Date.parse(e.target.value+'T00:00:00Z');if(!Number.isFinite(time)||time<f.from-DAY||time>f.referenceDay){toast('יום הייחוס מחוץ לתקופה שנבדקה');e.target.value=iso(record(s).referenceDay);return;}if(Object.values(record(s).jumps||{}).some(j=>j.decision==='approve-iron')){toast('לפני שינוי העוגן יש להעביר את האישורים הקיימים ל״לא בטוח״ ולאשר מחדש.');e.target.value=iso(record(s).referenceDay);return;}const day=s.analysis.days.filter(d=>d.t<=time&&d.raw.some(v=>v!==null)).at(-1);if(!day){toast('אין מדידה נקייה זמינה ליום ייחוס זה');return;}updateRecord(s,{referenceDay:day.t});detail(s);};draw(s);coverage(s);bindCasePager(s);$('review-content').scrollTop=scroll;
}
function zoom(s,a,b){from=Math.max(s.focus.from,a);to=Math.min(D.until,b);detailPanel='chart';pendingReviewScroll=0;detail(s);rememberWorkspace();}
function proposed(s){return s.focus.proposals.filter(p=>record(s).jumps?.[p.id]?.decision!=='leave');}
function offset(s,k,t){const ps=proposed(s),anchor=record(s).referenceDay??s.focus.referenceDay,key=s.axes[k].key;const cumulative=x=>ps.reduce((sum,p)=>sum+(p.time<=x?(p.changes.find(c=>c.axis===key)?.delta||0):0),0);return cumulative(anchor)-cumulative(t);}
function draw(s){const canvas=$('chart');if(!canvas||!s.analysis||!s.axes[axis])return;const box=canvas.getBoundingClientRect();if(!box.width||!box.height)return;const w=box.width,h=box.height,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const days=s.analysis.days.filter(d=>d.t+DAY>from&&d.t<=to),k=axis;const nums=days.flatMap(d=>[...(showMA?[d.smooth[k]]:[]),...(showRaw?[d.raw[k]]:[]),...(preview&&d.raw[k]!==null?[d.raw[k]+offset(s,k,d.t)]:[])]).filter(v=>v!==null&&Number.isFinite(v));let lo=nums.length?Math.min(...nums):-1,hi=nums.length?Math.max(...nums):1;if(hi-lo<0.001){lo-=0.5;hi+=0.5;}const pad=(hi-lo)*.14;lo-=pad;hi+=pad;const L=75,R=w-12,T=16,B=h-33,x=t=>L+(t-from)/Math.max(1,to-from)*(R-L),y=v=>B-(v-lo)/(hi-lo)*(B-T);c.font='13px system-ui';c.fillStyle='#64758a';c.textAlign='right';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,yy=y(v);c.strokeStyle='#e7edf4';c.beginPath();c.moveTo(L,yy);c.lineTo(R,yy);c.stroke();c.fillText(value(v),L-8,yy+4);}c.textAlign='center';const tickCount=w<500?3:5;for(let i=0;i<tickCount;i++){const t=from+(to-from)*i/(tickCount-1);c.textAlign=i===0?'left':i===tickCount-1?'right':'center';c.fillText(fmt(t),L+(R-L)*i/(tickCount-1),h-9);}c.save();c.beginPath();c.rect(L,T,R-L,B-T);c.clip();const shade=(g,color)=>{if(g.to<from||g.from>to)return;c.fillStyle=color;c.fillRect(x(Math.max(from,g.from)),T,Math.max(2,x(Math.min(to,g.to))-x(Math.max(from,g.from))),B-T);};s.focus.rawGaps.forEach(g=>shade(g,'#e9edf3'));if(mode==='ma')s.focus.maGaps.forEach(g=>shade(g,'#ffe8bf99'));if(mode==='jumps'){c.setLineDash([4,4]);for(const p of s.focus.proposals){if(p.time<from||p.time>to)continue;c.strokeStyle='#cb9b53';c.beginPath();c.moveTo(x(p.time),T);c.lineTo(x(p.time),B);c.stroke();}c.setLineDash([]);}function series(color,get,line){c.fillStyle=color;c.strokeStyle=color;c.lineWidth=2;let previous=null;for(const d of days){const v=get(d);if(v===null){previous=null;continue;}const xx=x(d.t+DAY/2),yy=y(v);if(line&&previous&&d.t-previous.t<=DAY*1.1){c.beginPath();c.moveTo(previous.x,previous.y);c.lineTo(xx,yy);c.stroke();}c.beginPath();c.arc(xx,yy,line?1.5:2,0,Math.PI*2);c.fill();previous={t:d.t,x:xx,y:yy};}}if(showRaw)series('#8191a4',d=>d.raw[k],false);if(showMA)series('#2463cc',d=>d.smooth[k],true);if(preview)series('#16805f',d=>d.raw[k]===null?null:d.raw[k]+offset(s,k,d.t),true);c.restore();if(!nums.length){c.textAlign='center';c.fillStyle='#68798d';c.fillText('אין ערכים זמינים בתצוגה זו — אפשר להפעיל ״מדידות״',w/2,h/2);}canvas.onmousemove=e=>{const t=from+(e.offsetX-L)/(R-L)*(to-from),d=days.reduce((best,d)=>!best||Math.abs(d.t+DAY/2-t)<Math.abs(best.t+DAY/2-t)?d:best,null);$('caption').textContent=d?iso(d.t)+' UTC | MA: '+value(d.smooth[k])+' | מדידות: '+value(d.raw[k])+' | '+nf(d.n)+' דגימות':'';};}
function coverage(s){const map=new Map(s.analysis.days.map(d=>[d.t,d]));let html='';for(let t=Math.floor(s.focus.from/DAY)*DAY;t<=D.until;t+=DAY){const d=map.get(t),missing=d&&d.n-d.suspect>d.ma;html+=`<i title="${iso(t)}: ${!d?'אין מדידות':d.suspect===d.n?'רק מדידות חשודות':missing?'יש מדידות, חסר MA':'קיים MA'}" style="background:${!d?'#cbd3de':d.suspect===d.n?'#cd7d87':missing?'#e9b25e':'#659bd1'}"></i>`;}$('coverage').innerHTML=html;}
function exportData(){return {schemaVersion:2,purpose:'review-only-not-executable',sourceProject:D.id,snapshot:D.createdAt,exportedAt:new Date().toISOString(),productionWrites:false,requiresFreshRead:true,preserveRawData:true,reviewer:$('reviewer').value,decisions:Object.entries(answers).map(([id,r])=>{const s=allSensors.find(s=>s.id===id);if(!s)return null;return {sensorId:id,siteId:s.projectId,siteName:s.projectName,sensorName:s.name,fingerprint:s.fingerprint,note:r.note||'',reviewer:r.reviewer||'',reviewedAt:r.reviewedAt,reference:{mode:r.referenceDay===s.focus.referenceDay?'latest':'selected-day',day:r.referenceDay,values:referenceValues(s,r.referenceDay),axes:s.axes.map(a=>({key:a.key,unit:a.unit})),resolution:'daily',basis:'clean baseline-adjusted raw daily medians'},gaps:r.gaps||{},jumps:Object.entries(r.jumps||{}).map(([proposalId,d])=>({proposalId,...d,evidence:s.focus.proposals.find(p=>p.id===proposalId),operation:'piecewise-continuity-baseline-keep-reference',requiresSampleBoundaryReview:true}))};}).filter(Boolean),legacyDecisions:legacy};}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>{for(const [id,r] of Object.entries(answers)){const s=allSensors.find(s=>s.id===id);for(const [pid,d] of Object.entries(r.jumps||{})){if(d.decision!=='approve-iron')continue;const p=s?.focus.proposals.find(p=>p.id===pid);if(!s||!p||!canApprove(s,p,r.referenceDay)||r.referenceDay!==s.focus.referenceDay&&!r.note?.trim()){toast('יש אישור ללא עוגן תקף או הסבר. יש לחזור לחיישן ולבדוק לפני הייצוא.');return;}}}download('scanin-decisions-'+D.createdAt.slice(0,10)+'.json',JSON.stringify(exportData(),null,2));};$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.snapshot!==D.createdAt||![1,2].includes(data.schemaVersion)||!Array.isArray(data.decisions))throw Error('הקובץ אינו שייך לצילום מצב זה. אין להעתיק אישורים אוטומטית.');if(data.schemaVersion===1){const next={...legacy};for(const d of data.decisions){const s=allSensors.find(s=>s.id===d.sensorId);if(!s||s.fingerprint!==d.fingerprint)throw Error('גרסת חיישן אינה תואמת');next[s.id]=d;}legacy=next;try{localStorage.setItem(legacyKey,JSON.stringify(legacy));}catch{toast('יש לייצא את ההחלטות לפני סגירה');}}else{const next={...answers};for(const d of data.decisions){const s=allSensors.find(s=>s.id===d.sensorId),reference=d.reference?.day;if(!s||s.fingerprint!==d.fingerprint||typeof d.note!=='string'||!Array.isArray(d.jumps)||!(reference===null&&s.focus.referenceDay===null&&!d.jumps.length||Number.isFinite(reference)&&reference>=s.focus.from-DAY&&reference<=s.focus.referenceDay))throw Error('מזהה, עוגן או גרסת חיישן אינם תואמים');const jumps={};for(const j of d.jumps){const p=s.focus.proposals.find(p=>p.id===j.proposalId);if(!p||JSON.stringify(j.evidence)!==JSON.stringify(p)||!['approve-iron','leave','unsure'].includes(j.decision)||j.decision==='approve-iron'&&(!canApprove(s,p,reference)||reference!==s.focus.referenceDay&&!d.note.trim()))throw Error('הצעת הגיהוץ אינה תואמת לצילום המצב');jumps[p.id]={decision:j.decision,reviewedAt:String(j.reviewedAt||''),reviewer:String(j.reviewer||'')};}const gaps={};for(const k of ['raw','ma'])if(d.gaps?.[k]){if(!['check-ma','acknowledged','no-action'].includes(d.gaps[k].decision))throw Error('החלטת חוסר אינה תקינה');gaps[k]={decision:d.gaps[k].decision,reviewedAt:String(d.gaps[k].reviewedAt||'')};}next[s.id]={fingerprint:s.fingerprint,referenceDay:reference,note:d.note,jumps,gaps,reviewer:String(d.reviewer||''),reviewedAt:String(d.reviewedAt||'')};}answers=next;persist();}render();toast('ההחלטות יובאו לדפדפן בלבד — לא הופעל גיהוץ');}catch(error){toast(error.message||String(error));}e.target.value='';};
$('site-filter').onchange=e=>switchSite(e.target.value);$('search').oninput=e=>{query=e.target.value;selected=null;sensorPage=0;render();};$('include-demo').onchange=()=>{rememberWorkspace();site='';selected=null;sitePage=0;sensorPage=0;render();};$('site-search').oninput=e=>{siteQuery=e.target.value;sitePage=0;renderSites();};$('all-sites').onclick=()=>switchSite('');$('prev-site').innerHTML=icon('right');$('next-site').innerHTML=icon('left');$('prev-site').onclick=()=>moveSite(-1);$('next-site').onclick=()=>moveSite(1);$('brand-icon').innerHTML=icon('ma');$('export').insertAdjacentHTML('afterbegin',icon('download'));$('scope-open').insertAdjacentHTML('afterbegin',icon('info'));$('scope-open').onclick=()=>$('scope-dialog').showModal();$('scope-close').onclick=()=>$('scope-dialog').close();$('review-action').onclick=()=>setDetailPanel(detailPanel==='chart'?'decision':'chart');
let resize,scrollTimer;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>{if(selected)draw(allSensors.find(s=>s.id===selected));},100);});$('review-content').addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(rememberWorkspace,180);});window.addEventListener('beforeunload',rememberWorkspace);
if(['raw','ma','jumps'].includes(workspaceMemory.mode))mode=workspaceMemory.mode;site=typeof workspaceMemory.site==='string'?workspaceMemory.site:'';sitePage=Number.isInteger(workspaceMemory.sitePage)?workspaceMemory.sitePage:0;$('include-demo').checked=workspaceMemory.includeDemo===true;$('reviewer').value=typeof workspaceMemory.reviewer==='string'?workspaceMemory.reviewer:'';$('desk').dataset.mobile=workspaceMemory.mobile==='review'?'review':'list';restoreContext();render();
</script>
